document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e0473f; /* DANGER */\n  --crimson-500: #b8302a;\n\n  /* ---- Ink / text ramp (dark on light) ---- */\n  --white: #ffffff;\n  --gray-100: #20302a; /* near-black ink */\n  --gray-300: #46544b; /* body copy */\n  --gray-400: #788278; /* muted */\n  --gray-600: #899389; /* faint labels */\n  --gray-650: #9aa69c; /* question-mark fill */\n  --gray-700: #c8d2c8; /* very faint silhouettes — recede on white */\n\n  /* ---- Semantic aliases ---- */\n  --bg-deep: #eaf2e6;\n  --bg-base: var(--navy-700);\n  --bg-raised: var(--navy-600);\n\n  --surface-card: rgba(22, 39, 29, 0.03);\n  --surface-card-solid: var(--navy-500);\n  --surface-glass: rgba(255, 255, 255, 0.72);\n\n  --border-subtle: rgba(22, 39, 29, 0.10);\n  --border-strong: rgba(22, 39, 29, 0.18);\n  --border-accent: rgba(242, 153, 74, 0.5);\n\n  --text-primary: #18271f;\n  --text-body: var(--gray-300);\n  --text-muted: var(--gray-400);\n  --text-on-accent: var(--navy-900);\n\n  --accent: var(--amber-400);\n  --accent-strong: var(--amber-500);\n  --accent-2: var(--teal-400);\n  --danger: var(--crimson-400);\n  --success: var(--teal-400);\n}\n<\u002Fstyle>\n<style>/* Crave — Typography tokens\n   Syne (bold, wide) for display/headings; Inter for body & UI. */\n:root {\n  --font-display: 'Syne', 'Trebuchet MS', sans-serif;\n  --font-body: 'Inter', system-ui, -apple-system, sans-serif;\n\n  /* Fluid type scale */\n  --text-hero: clamp(2.75rem, 6.5vw, 5.5rem);\n  --text-display: clamp(2.25rem, 4.5vw, 3.75rem);\n  --text-h1: clamp(1.9rem, 3.4vw, 2.85rem);\n  --text-h2: clamp(1.45rem, 2.4vw, 2rem);\n  --text-h3: 1.4rem;\n  --text-lg: 1.2rem;\n  --text-base: 1rem;\n  --text-sm: 0.875rem;\n  --text-xs: 0.75rem;\n  --text-eyebrow: 0.78rem;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extra: 800;\n\n  /* Line height */\n  --leading-none: 1;\n  --leading-tight: 1.06;\n  --leading-snug: 1.25;\n  --leading-normal: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight: -0.025em;\n  --tracking-snug: -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-eyebrow: 0.18em;\n}\n<\u002Fstyle>\n<style>/* Crave — Spacing, radius & layout tokens. 4px base grid. */\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* Section rhythm */\n  --section-pad-y: clamp(64px, 10vw, 144px);\n  --container-max: 1180px;\n  --container-pad: clamp(20px, 5vw, 64px);\n\n  /* Radii */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 16px;\n  --radius-lg: 24px;\n  --radius-xl: 32px;\n  --radius-pill: 999px;\n}\n<\u002Fstyle>\n<style>/* Crave — Effects: shadows, glows, transitions, gradients (LIGHT theme).\n   Light UI relies on soft, low-alpha shadows; accent \"glows\" become a tinted\n   ring + soft colored shadow rather than a neon bloom. */\n:root {\n  /* Elevation shadows (soft, warm-neutral) */\n  --shadow-sm: 0 1px 2px rgba(22, 39, 29, 0.06), 0 2px 6px rgba(22, 39, 29, 0.06);\n  --shadow-md: 0 2px 6px rgba(22, 39, 29, 0.05), 0 10px 26px rgba(22, 39, 29, 0.09);\n  --shadow-lg: 0 8px 18px rgba(22, 39, 29, 0.08), 0 28px 60px rgba(22, 39, 29, 0.14);\n\n  /* Accent glows — tinted ring + soft colored lift */\n  --glow-amber: 0 0 0 1px rgba(242, 153, 74, 0.45), 0 12px 32px rgba(242, 153, 74, 0.24);\n  --glow-teal: 0 0 0 1px rgba(87, 191, 128, 0.45), 0 12px 32px rgba(87, 191, 128, 0.22);\n  --glow-crimson: 0 0 0 1px rgba(224, 71, 63, 0.4), 0 12px 32px rgba(224, 71, 63, 0.22);\n\n  /* Inset hairline for cards (subtle dark edge) */\n  --inset-hairline: inset 0 0 0 1px rgba(22, 39, 29, 0.04);\n\n  /* Transitions */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 260ms; /* @kind other */\n  --dur-slow: 600ms; /* @kind other */\n\n  /* Signature gradients */\n  --grad-amber: linear-gradient(135deg, #ffd9a8 0%, #f2994a 60%, #e07d28 100%); /* @kind color */\n  --grad-teal: linear-gradient(135deg, #8fe0a9 0%, #57bf80 100%); /* @kind color */\n  --grad-danger: linear-gradient(135deg, #f4837b 0%, #e0473f 100%); /* @kind color */\n  --grad-divider: linear-gradient(90deg, transparent, rgba(242, 153, 74, 0.55), rgba(87, 191, 128, 0.5), transparent); /* @kind color */\n  --grad-glass: linear-gradient(160deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.5)); /* @kind color */\n}\n<\u002Fstyle>\n<style>/* Crave Design System — global entry point.\n   Consumers link THIS file only. Import list, no rules. */\n/* Crave — Webfonts.\n   Syne (display) + Inter (body) loaded from Google Fonts.\n   NOTE: served via Google Fonts CDN @import for reliability. If you need\n   fully offline/self-hosted binaries, drop the .woff2 files in tokens/fonts/\n   and replace this with local @font-face rules pointing at those files. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0f3c76bd-72db-4d55-8ee6-96788124a905\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"71f66e7e-698b-4695-b619-14a052ca0a01\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5e394930-77d8-4687-ae20-6ed08527c135\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ded380f4-b5c9-4c5f-b4f8-4315d0b3343e\") format('woff2');\n  unicode-  U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* greek */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"9955f0c0-c599-4ee4-92eb-edb15bf13d88\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f7f002b1-095f-46f8-b6f4-ea0d47ccc62c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f916baa7-34e5-4638-8e25-c83d8156f3d6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Crave — Color tokens (LIGHT theme)\n   Airy light-green-white canvas, white cards, light-orange primary,\n   light-green secondary, soft coral-red reserved for pain/loss moments. */\n:root {\n  /* ---- Surface / neutral ramp (light \"paper\" — faint green tint) ----\n     Note: --navy-900 is kept DARK as the ink used on top of accent fills. */\n  --navy-900: #16271d; /* deep ink — text on accent gradients, strong labels */\n  --navy-800: #eef4ea; /* dim / disabled surface */\n  --navy-700: #f3f8f0; /* BASE canvas — light green-white */\n  --navy-600: #ffffff; /* raised surface (notifications, popovers) */\n  --navy-500: #ffffff; /* card / panel */\n  --navy-400: #e9f1e6; /* neutral chip */\n  --navy-300: #cdd8c9; /* muted stroke */\n\n  /* ---- Amber → light orange (primary accent) ---- */\n  --amber-300: #ffd9a8;\n  --amber-400: #f2994a; /* PRIMARY */\n  --amber-500: #e07d28;\n\n  /* ---- Teal → light green (secondary accent) ---- */\n  --teal-300: #2f9e5d; /* readable green for text/values on light */\n  --teal-400: #57bf80; /* SECONDARY */\n  --teal-500: #3a9d5e;\n\n  /* ---- Crimson → soft coral red (pain / problem / loss) ---- */\n  --crimson-300: #cc3b34; /* readable red for text/values on light */\n  --crimson-400: #e0473f; /* DANGER */\n  --crimson-500: #b8302a;\n\n  /* ---- Ink / text ramp (dark on light) ---- */\n  --white: #ffffff;\n  --gray-100: #20302a; /* near-black ink */\n  --gray-300: #46544b; /* body copy */\n  --gray-400: #788278; /* muted */\n  --gray-600: #899389; /* faint labels */\n  --gray-650: #9aa69c; /* question-mark fill */\n  --gray-700: #c8d2c8; /* very faint silhouettes — recede on white */\n\n  /* ---- Semantic aliases ---- */\n  --bg-deep: #eaf2e6;\n  --bg-base: var(--navy-700);\n  --bg-raised: var(--navy-600);\n\n  --surface-card: rgba(22, 39, 29, 0.03);\n  --surface-card-solid: var(--navy-500);\n  --surface-glass: rgba(255, 255, 255, 0.72);\n\n  --border-subtle: rgba(22, 39, 29, 0.10);\n  --border-strong: rgba(22, 39, 29, 0.18);\n  --border-accent: rgba(242, 153, 74, 0.5);\n\n  --text-primary: #18271f;\n  --text-body: var(--gray-300);\n  --text-muted: var(--gray-400);\n  --text-on-accent: var(--navy-900);\n\n  --accent: var(--amber-400);\n  --accent-strong: var(--amber-500);\n  --accent-2: var(--teal-400);\n  --danger: var(--crimson-400);\n  --success: var(--teal-400);\n}\n\n/* Crave — Typography tokens\n   Syne (bold, wide) for display/headings; Inter for body & UI. */\n:root {\n  --font-display: 'Syne', 'Trebuchet MS', sans-serif;\n  --font-body: 'Inter', system-ui, -apple-system, sans-serif;\n\n  /* Fluid type scale */\n  --text-hero: clamp(2.75rem, 6.5vw, 5.5rem);\n  --text-display: clamp(2.25rem, 4.5vw, 3.75rem);\n  --text-h1: clamp(1.9rem, 3.4vw, 2.85rem);\n  --text-h2: clamp(1.45rem, 2.4vw, 2rem);\n  --text-h3: 1.4rem;\n  --text-lg: 1.2rem;\n  --text-base: 1rem;\n  --text-sm: 0.875rem;\n  --text-xs: 0.75rem;\n  --text-eyebrow: 0.78rem;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extra: 800;\n\n  /* Line height */\n  --leading-none: 1;\n  --leading-tight: 1.06;\n  --leading-snug: 1.25;\n  --leading-normal: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight: -0.025em;\n  --tracking-snug: -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-eyebrow: 0.18em;\n}\n\n/* Crave — Spacing, radius & layout tokens. 4px base grid. */\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* Section rhythm */\n  --section-pad-y: clamp(64px, 10vw, 144px);\n  --container-max: 1180px;\n  --container-pad: clamp(20px, 5vw, 64px);\n\n  /* Radii */\n  --radius-xs: 6px;\n  --radius-sm: 10px;\n  --radius-md: 16px;\n  --radius-lg: 24px;\n  --radius-xl: 32px;\n  --radius-pill: 999px;\n}\n\n/* Crave — Effects: shadows, glows, transitions, gradients (LIGHT theme).\n   Light UI relies on soft, low-alpha shadows; accent \"glows\" become a tinted\n   ring + soft colored shadow rather than a neon bloom. */\n:root {\n  /* Elevation shadows (soft, warm-neutral) */\n  --shadow-sm: 0 1px 2px rgba(22, 39, 29, 0.06), 0 2px 6px rgba(22, 39, 29, 0.06);\n  --shadow-md: 0 2px 6px rgba(22, 39, 29, 0.05), 0 10px 26px rgba(22, 39, 29, 0.09);\n  --shadow-lg: 0 8px 18px rgba(22, 39, 29, 0.08), 0 28px 60px rgba(22, 39, 29, 0.14);\n\n  /* Accent glows — tinted ring + soft colored lift */\n  --glow-amber: 0 0 0 1px rgba(242, 153, 74, 0.45), 0 12px 32px rgba(242, 153, 74, 0.24);\n  --glow-teal: 0 0 0 1px rgba(87, 191, 128, 0.45), 0 12px 32px rgba(87, 191, 128, 0.22);\n  --glow-crimson: 0 0 0 1px rgba(224, 71, 63, 0.4), 0 12px 32px rgba(224, 71, 63, 0.22);\n\n  /* Inset hairline for cards (subtle dark edge) */\n  --inset-hairline: inset 0 0 0 1px rgba(22, 39, 29, 0.04);\n\n  /* Transitions */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast: 140ms; /* @kind other */\n  --dur-base: 260ms; /* @kind other */\n  --dur-slow: 600ms; /* @kind other */\n\n  /* Signature gradients */\n  --grad-amber: linear-gradient(135deg, #ffd9a8 0%, #f2994a 60%, #e07d28 100%); /* @kind color */\n  --grad-teal: linear-gradient(135deg, #8fe0a9 0%, #57bf80 100%); /* @kind color */\n  --grad-danger: linear-gradient(135deg, #f4837b 0%, #e0473f 100%); /* @kind color */\n  --grad-divider: linear-gradient(90deg, transparent, rgba(242, 153, 74, 0.55), rgba(87, 191, 128, 0.5), transparent); /* @kind color */\n  --grad-glass: linear-gradient(160deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.5)); /* @kind color */\n}\n\n<\u002Fstyle>\n<script src=\"8eb1e816-2195-48ba-a578-0b63d2e2e580\"><\u002Fscript>\n<script src=\"f45a1739-e1e3-46bd-b95d-3c5193b4f9fd\"><\u002Fscript>\n<script src=\"b8a1fe05-6429-44b6-8e28-0f5a3f66843f\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; }\n  @keyframes craveFloat { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-22px) rotate(6deg); } }\n  @keyframes craveDrift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(18px); } }\n  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"font-family: var(--font-body); color: var(--text-body); background: var(--bg-base); overflow-x: hidden; position: relative;\">\n\n  <!-- ============ NAV ============ -->\n  <nav style=\"position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: rgba(243,248,240,0.72); border-bottom: 1px solid var(--border-subtle);\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto; padding: 14px var(--container-pad); display: flex; align-items: center; justify-content: space-between; gap: 24px;\">\n      <a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none;\">\n        <span style=\"width: 14px; height: 14px; border-radius: 999px; background: var(--grad-amber); box-shadow: var(--glow-amber);\"><\u002Fspan>\n        <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; color: var(--text-primary);\">Crave<\u002Fspan>\n      <\u002Fa>\n      <div style=\"display: flex; align-items: center; gap: 28px;\">\n        <div style=\"display: flex; gap: 26px; font-size: 14.5px; font-weight: 500; color: var(--text-muted);\">\n          <a href=\"#problem\" style=\"color: inherit; text-decoration: none;\">The Problem<\u002Fa>\n          <a href=\"#solution\" style=\"color: inherit; text-decoration: none;\">The Fix<\u002Fa>\n          <a href=\"#numbers\" style=\"color: inherit; text-decoration: none;\">The Numbers<\u002Fa>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.Button\" size=\"sm\" onclick=\"{{ goDemo }}\" hint-size=\"auto,36px\">Book a demo<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ============ HERO ============ -->\n  <header id=\"top\" style=\"position: relative; padding: clamp(56px,9vw,120px) var(--container-pad) clamp(48px,7vw,88px); overflow: hidden;\">\n    <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; pointer-events: none; background:\n      radial-gradient(420px 320px at 12% 8%, rgba(242,153,74,0.16), transparent 70%),\n      radial-gradient(460px 360px at 92% 22%, rgba(87,191,128,0.16), transparent 70%);\"><\u002Fdiv>\n    <span aria-hidden=\"true\" style=\"position: absolute; top: 16%; left: 7%; font-size: 30px; opacity: 0.5; animation: craveFloat 7s ease-in-out infinite;\">☕<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"position: absolute; top: 64%; left: 14%; font-size: 22px; opacity: 0.4; animation: craveDrift 9s ease-in-out infinite;\">☕<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"position: absolute; top: 24%; right: 9%; font-size: 26px; opacity: 0.45; animation: craveDrift 8s ease-in-out infinite;\">🥐<\u002Fspan>\n\n    <div style=\"position: relative; max-width: var(--container-max); margin: 0 auto; text-align: center;\">\n      <div data-reveal=\"\" style=\"display: inline-flex; margin-bottom: 22px;\">\n        <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.Badge\" tone=\"amber\" hint-size=\"auto,26px\">For café &amp; restaurant owners<\u002Fx-import>\n      <\u002Fdiv>\n      <h1 data-reveal=\"\" style=\"font-family: var(--font-display); font-weight: 800; font-size: var(--text-hero); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--text-primary); margin: 0 auto; max-width: 16ch; text-wrap: balance;\">\n        Your café is losing money every day — <span style=\"color: var(--crimson-300);\">and the platform keeps the customer.<\u002Fspan>\n      <\u002Fh1>\n      <p data-reveal=\"\" style=\"margin: 26px auto 0; max-width: 56ch; font-size: var(--text-lg); line-height: var(--leading-normal); color: var(--text-body);\">\n        You cooked the food. You did the work. But every aggregator order takes a 25% cut <em>and<\u002Fem> hides who your customer is. Crave gives you a <strong style=\"color: var(--text-primary);\">fully custom ordering app<\u002Fstrong> — your brand, your customers, zero commission.\n      <\u002Fp>\n      <div data-reveal=\"\" style=\"display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 34px;\">\n        <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.Button\" variant=\"primary\" size=\"lg\" glow=\"true\" onclick=\"{{ goDemo }}\" hint-size=\"auto,52px\">Book a free demo<\u002Fx-import>\n        <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.Button\" variant=\"secondary\" size=\"lg\" onclick=\"{{ goProblem }}\" hint-size=\"auto,52px\">Show me the leak<\u002Fx-import>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 760px; margin: 56px auto 0;\">\n        <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 22px 18px; box-shadow: var(--shadow-sm);\">\n          <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 38px; color: var(--crimson-300); line-height: 1;\"><x-import component-from-global-scope=\"CraveDesignSystem_f1975e.StatCounter\" value=\"30000\" prefix=\"₹\" accent=\"crimson\" style=\"font-size:38px\" hint-size=\"auto,40px\"><\u002Fx-import><\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 13.5px; color: var(--text-muted);\">lost to commission / month<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 22px 18px; box-shadow: var(--shadow-sm);\">\n          <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 38px; color: var(--amber-500); line-height: 1;\"><x-import component-from-global-scope=\"CraveDesignSystem_f1975e.StatCounter\" value=\"40\" suffix=\"%\" accent=\"amber\" style=\"font-size:38px\" hint-size=\"auto,40px\"><\u002Fx-import><\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 13.5px; color: var(--text-muted);\">of revenue runs through platforms<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 22px 18px; box-shadow: var(--shadow-sm);\">\n          <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 38px; color: var(--text-primary); line-height: 1;\"><x-import component-from-global-scope=\"CraveDesignSystem_f1975e.StatCounter\" value=\"12\" suffix=\"%\" accent=\"none\" style=\"font-size:38px\" hint-size=\"auto,40px\"><\u002Fx-import><\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 13.5px; color: var(--text-muted);\">of platform diners ever return to you<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"\" style=\"margin: 18px auto 0; max-width: 60ch; font-size: 12.5px; line-height: var(--leading-snug); color: var(--text-muted);\">Illustrative scenario for a café doing ~₹1,20,000/month online, drawn from industry benchmarks. Your numbers will vary — we'll model your real ones on the demo call.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ PROBLEM: where orders come from ============ -->\n  <section id=\"problem\" style=\"padding: var(--section-pad-y) var(--container-pad); border-top: 1px solid var(--border-subtle);\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto;\">\n      <div data-reveal=\"\" style=\"text-align: center; max-width: 60ch; margin: 0 auto 56px;\">\n        <div style=\"font-family: var(--font-body); font-weight: 700; font-size: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--crimson-300); margin-bottom: 14px;\">The hidden problem<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-display); font-weight: 800; font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--text-primary); margin: 0;\">Where do your orders actually come from?<\u002Fh2>\n        <p style=\"margin: 18px auto 0; font-size: var(--text-lg); line-height: var(--leading-normal); color: var(--text-body);\">Most owners guess \"walk-ins.\" The data says otherwise — and the biggest slice is the one you control the least.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch;\">\n        <div data-reveal=\"\" style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 28px; box-shadow: var(--shadow-md);\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 8px;\">\n            <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--text-primary);\">Where your online orders come from<\u002Fdiv>\n            <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 9px; white-space: nowrap;\">Illustrative<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position: relative; height: 320px;\"><canvas data-chart=\"orders\"><\u002Fcanvas><\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-size: 12px; line-height: var(--leading-snug); color: var(--text-muted); text-align: center;\">Typical mix based on industry benchmarks — not your audited figures.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"display: flex; flex-direction: column; justify-content: center; gap: 22px;\">\n          <div style=\"background: rgba(224,71,63,0.08); border: 1px solid rgba(224,71,63,0.25); border-radius: var(--radius-lg); padding: 24px;\">\n            <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--crimson-300); line-height: 1.1;\">40% of your revenue<\u002Fdiv>\n            <p style=\"margin: 10px 0 0; color: var(--text-body); line-height: var(--leading-normal);\">goes through platforms that <strong style=\"color: var(--text-primary);\">hide your customer's data<\u002Fstrong>. You never get their name, their number, or a second chance to win them back.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px; (--text-body);\">Here's the monthly math on your online revenue — and where almost half of it quietly disappears before it reaches you.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch;\">\n        <div data-reveal=\"\" style=\"display: flex; flex-direction: column; justify-content: center; gap: 18px; order: 1;\">\n          <div style=\"display: flex; align-items: center; gap: 14px; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px 20px; box-shadow: var(--shadow-sm);\">\n            <span style=\"width: 12px; height: 12px; border-radius: 4px; background: var(--crimson-400); flex: 0 0 auto;\"><\u002Fspan>\n            <div style=\"flex: 1;\"><div style=\"font-weight: 700; color: var(--text-primary);\">Platform commission (25%)<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-family: var(--font-display); font-weight: 800; color: var(--crimson-300);\">₹30,000<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 14px; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px 20px; box-shadow: var(--shadow-sm);\">\n            <span style=\"width: 12px; height: 12px; border-radius: 4px; background: var(--amber-500); flex: 0 0 auto;\"><\u002Fspan>\n            <div style=\"flex: 1;\"><div style=\"font-weight: 700; color: var(--text-primary);\">Instagram &amp; promo ads<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-family: var(--font-display); font-weight: 800; color: var(--amber-500);\">₹8,000<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 14px; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px 20px; box-shadow: var(--shadow-sm);\">\n            <span style=\"width: 12px; height: 12px; border-radius: 4px; background: var(--amber-300); flex: 0 0 auto;\"><\u002Fspan>\n            <div style=\"flex: 1;\"><div style=\"font-weight: 700; color: var(--text-primary);\">Packaging &amp; misc<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-family: var(--font-display); font-weight: 800; color: var(--text-muted);\">₹20,000<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 14px; background: rgba(87,191,128,0.1); border: 1px solid rgba(87,191,128,0.3); border-radius: var(--radius-md); padding: 16px 20px;\">\n            <span style=\"width: 12px; height: 12px; border-radius: 4px; background: var(--teal-400); flex: 0 0 auto;\"><\u002Fspan>\n            <div style=\"flex: 1;\"><div style=\"font-weight: 700; color: var(--text-primary);\">Actual profit to you<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-family: var(--font-display); font-weight: 800; color: var(--teal-300);\">₹62,000<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 6px;\">\n            <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.ProgressBar\" value=\"52\" accent=\"crimson\" label=\"You keep just 52% of what you earn online\" hint-size=\"100%,44px\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 28px; box-shadow: var(--shadow-md); order: 2;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 8px;\">\n            <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--text-primary);\">Where your commission money goes<\u002Fdiv>\n            <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 9px; white-space: nowrap;\">Example<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position: relative; height: 320px;\"><canvas data-chart=\"money\"><\u002Fcanvas><\u002Fdiv>\n          <p style=\"margin: 12px 0 0; font-size: 12px; line-height: var(--leading-snug); color: var(--text-muted); text-align: center;\">Example breakdown on ₹1,20,000/month online revenue. Swap in your real figures on the demo call.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SOLUTION ============ -->\n  <section id=\"solution\" style=\"padding: var(--section-pad-y) var(--container-pad); border-top: 1px solid var(--border-subtle);\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto;\">\n      <div data-reveal=\"\" style=\"text-align: center; max-width: 60ch; margin: 0 auto 56px;\">\n        <div style=\"font-family: var(--font-body); font-weight: 700; font-size: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--teal-300); margin-bottom: 14px;\">The fix<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-display); font-weight: 800; font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--text-primary); margin: 0;\">Your own app. Your customers. 0% on direct orders.<\u002Fh2>\n        <p style=\"margin: 18px auto 0; font-size: var(--text-lg); line-height: var(--leading-normal); color: var(--text-body);\">We build you a fully branded ordering experience — a QR-code web app live in days, with an optional app-store listing once you've validated demand. Stop renting customers from the platform — start owning the relationship.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;\">\n        <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.GlowCard\" accent=\"amber\" hint-s :center; justify-content:space-between; margin-bottom: 14px;\">\n            <span style=\"font-weight:700; color:var(--text-muted); font-size:14px;\">On the aggregator<\u002Fspan>\n            <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--crimson-300); border: 1px solid rgba(224,71,63,0.35); border-radius: 999px; padding: 3px 9px;\">1 of 40+<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background: #eef4ea; border-radius: var(--radius-lg); padding: 12px; filter: saturate(0.6);\">\n            <div style=\"height:9px; width:55%; border-radius:5px; background:#cdd8c9; margin: 4px 4px 12px;\"><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns: 1fr 1fr; gap:10px;\">\n              <div style=\"background:#fff; border:1px solid var(--border-subtle); border-radius:12px; padding:10px; opacity:0.7;\"><div style=\"height:38px; border-radius:8px; background:#dfe7da;\"><\u002Fdiv><div style=\"height:7px; width:70%; background:#cdd8c9; border-radius:4px; margin-top:8px;\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff; border:1px solid var(--border-subtle); border-radius:12px; padding:10px; opacity:0.7;\"><div style=\"height:38px; border-radius:8px; background:#dfe7da;\"><\u002Fdiv><div style=\"height:7px; width:60%; background:#cdd8c9; border-radius:4px; margin-top:8px;\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"position:relative; background:#fff; border:2px solid var(--amber-400); border-radius:12px; padding:10px;\"><div style=\"position:absolute; top:-9px; left:8px; font-size:8.5px; font-weight:800; background:var(--amber-400); color:var(--navy-900); padding:1px 6px; border-radius:999px;\">YOU<\u002Fdiv><div style=\"height:38px; border-radius:8px; background:var(--amber-300);\"><\u002Fdiv><div style=\"height:7px; width:75%; background:#20302a; border-radius:4px; margin-top:8px;\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff; border:1px solid var(--border-subtle); border-radius:12px; padding:10px; opacity:0.7;\"><div style=\"height:38px; border-radius:8px; background:#dfe7da;\"><\u002Fdiv><div style=\"height:7px; width:65%; background:#cdd8c9; border-radius:4px; margin-top:8px;\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff; border:1px solid var(--border-subtle); border-radius:12px; padding:10px; opacity:0.7;\"><div style=\"height:38px; border-radius:8px; background:#dfe7da;\"><\u002Fdiv><div style=\"height:7px; width:55%; background:#cdd8c9; border-radius:4px; margin-top:8px;\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"background: rgba(224,71,63,0.1); border:1px dashed rgba(224,71,63,0.4); border-radius:12px; padding:10px; display:flex; align-items:center; justify-content:center;\"><span style=\"font-size:9.5px; font-weight:700; color:var(--crimson-300); text-align:center;\">Competitor ad<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 14px 2px 0; font-size: 13px; line-height: var(--leading-normal); color: var(--text-muted);\">Discounts decide the click. The customer remembers the <em>app<\u002Fem>, not your café.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- Own app side -->\n        <div style=\"position:relative; overflow:hidden; background: var(--surface-card-solid); border: 1px solid var(--border-accent); border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--glow-amber);\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px;\">\n            <span style=\"font-weight:700; color:var(--text-primary); font-size:14px;\">On your own app<\u002Fspan>\n            <span style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--navy-900); background: var(--grad-teal); border-radius: 999px; padding: 3px 9px;\">100% you<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-radius: var(--radius-lg); overflow:hidden; border:1px solid var(--border-subtle);\">\n            <div style=\"background: var(--grad-amber); padding: 16px;\">\n              <div style=\"font-family: var(--font-display); font-weight:800; font-size:18px; color:var(--navy-900);\">Brew &amp; Co.<\u002Fdiv>\n              <div style=\"font-size:11px; color:rgba(22,39,29,0.7); margin-top:2px;\">Your neighbourhood coffee, on tap<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff; padding: 14px; display:flex; flex-direction:column; gap:10px;\">\n              <div style=\"height:70px; border-radius:12px; background: linear-gradient(135deg, var(--amber-300), var(--teal-300)); display:flex; align-items:flex-end; padding:10px;\"><span style=\"font-size:11px; font-weight:800; color:var(--navy-900); background:#fff; padding:3px 8px; border-radius:999px;\">Today: free pastry over ₹400<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:10px;\">\n                <div style=\"flex:1; height:46px; border-radius:10px; background:var(--navy-400);\"><\u002Fdiv>\n                <div style=\"flex:1; height:46px; border-radius:10px; background:var(--navy-400);\"><\u002Fdiv>\n                <div style=\"flex:1; height:46px; border-radius:10px; background:var(--navy-400);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 14px 2px 0; font-size: 13px; line-height: var(--leading-normal); color: var(--text-body);\">No competitors. No ads. Just your menu, your offers, your story — front and centre.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"display:grid; grid-template-columns: repeat(3,1fr); gap: 22px; margin-top: 28px;\">\n        <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--amber-400); border-radius: var(--radius-lg); padding: 22px;\">\n          <div style=\"font-weight:700; color:var(--text-primary); font-size:15px;\">Stronger recall<\u002Fdiv>\n          <p style=\"margin:6px 0 0; font-size:13.5px; color:var(--text-muted); line-height:var(--leading-normal);\">Your icon sits on their home screen — not buried in a search result.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--teal-400); border-radius: var(--radius-lg); padding: 22px;\">\n          <div style=\"font-weight:700; color:var(--text-primary); font-size:15px;\">No competitor ads<\u002Fdiv>\n          <p style=\"margin:6px 0 0; font-size:13.5px; color:var(--text-muted); line-height:var(--leading-normal);\">Nobody outbids you for a slot next to your own menu.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--amber-400); border-radius: var(--radius-lg); padding: 22px;\">\n          <div style=\"font-weight:700; color:var(--text-primary); font-size:15px;\">Full control<\u002Fdiv>\n          <p style=\"margin:6px 0 0; font-size:13.5px; color:var(--text-muted); line-height:var(--leading-normal);\">You set the photos, the wording, the offers — the whole presentation.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ NUMBERS / AFTER ============ -->\n  <section id=\"numbers\" style=\"padding: var(--section-pad-y) var(--container-pad); border-top: 1px solid var(--border-subtle);\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto;\">\n      <div data-reveal=\"\" style=\"text-align: center; max-width: 62ch; margin: 0 auto 56px;\">\n        <div style=\"font-family: var(--font-body); font-weight: 700; font-size: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--amber-500); margin-bottom: 14px;\">The numbers after switching<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-display); font-weight: 800; font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--text-primary); margin: 0;\">Shift just 20% of orders to direct.<\u002Fh2>\n        <p style=\"margin: 18px auto 0; font-size: var(--text-lg); line-height: var(--leading-normal); color: var(--text-body);\">You don't have to leave the platforms overnight. Moving a fifth of your orders to your own app changes the whole picture.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch;\">\n        <div data-reveal=\"\" style=\"display: flex; flex-direction: column; justify-content: center; gap: 18px;\">\n          <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px 18px;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber-500); margin-bottom: 6px;\">The inputs<\u002Fdiv>\n            <p style=\"margin: 0; font-size: 13.5px; line-height: var(--leading-normal); color: var(--text-body);\">Assuming <strong style=\"color:var(--text-primary);\">₹1,20,000/month<\u002Fstrong> in current Swiggy/Zomato orders at <strong style=\"color:var(--text-primary);\">25% commission<\u002Fstrong> — shifting 20% of that (<strong style=\"color:var(--text-primary);\">₹24,000<\u002Fstrong>) to your own app removes <strong style=\"color:var(--text-primary);\">₹6,000/month<\u002Fstrong> in fees (25% × ₹24,000).<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: rgba(87,191,128,0.1); border: 1px solid rgba(87,191,128,0.3); border-radius: var(--radius-lg); padding: 24px;\">\n            <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--teal-300); line-height: 1.1;\">Save ₹6,000 / month<\u002Fdiv>\n            <p style=\"margin: 10px 0 0; color: var(--text-body); line-height: var(--leading-normal);\">that's <strong style=\"color:var(--text-primary);\">₹72,000 a year<\u002Fstrong> back in your pocket, before a single new customer.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm);\">\n            <div style=\"font-size: 13px; font-weight: 700; color: var(--text-primary);\">Your online order mix, after the shift<\u002Fdiv>\n            <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.ProgressBar\" value=\"55\" accent=\"teal\" label=\"Direct orders — 0% commission\" hint-size=\"100%,44px\"><\u002Fx-import>\n            <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.ProgressBar\" value=\"25\" accent=\"amber\" label=\"Platform orders — reduced\" hint-size=\"100%,44px\"><\u002Fx-import>\n            <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.ProgressBar\" value=\"20\" accent=\"teal\" label=\"New repeat customers\" hint-size=\"100%,44px\"><\u002Fx-import>\n            <p style=\"margin: 2px 0 0; font-size: 12px; line-height: var(--leading-snug); color: var(--text-muted);\">55% + 25% + 20% = 100% of online orders. Illustrative target mix — sanity-check it against your own monthly volume.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 28px; box-shadow: var(--shadow-md);\">\n          <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--text-primary); margin-bottom: 8px;\">Revenue distribution after switching<\u002Fdiv>\n          <div style=\"position: relative; height: 320px;\"><canvas data-chart=\"after\"><\u002Fcanvas><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- probability strip -->\n      <div data-reveal=\"\" style=\"margin-top: 48px;\">\n        <div style=\"text-align:center; margin-bottom: 26px;\">\n          <h3 style=\"font-family: var(--font-display); font-weight: 800; font-size: var(--text-h2); color: var(--text-primary); margin: 0;\">The honest probabilities<\u002Fh3>\n          <p style=\"margin: 10px auto 0; max-width: 56ch; color: var(--text-body); line-height: var(--leading-normal);\">No hype. Here's what's realistic if nothing changes — versus what an owned channel does to the odds.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns: repeat(3,1fr); gap: 22px;\">\n          <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-top: 3px solid var(--crimson-400); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow-sm);\">\n            <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 34px; color: var(--crimson-300); line-height: 1;\">15–25%<\u002Fdiv>\n            <div style=\"margin-top: 10px; font-weight: 700; color: var(--text-primary);\">Year-1 growth, model unchanged<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 14px; color: var(--text-muted); line-height: var(--leading-normal);\">Staying platform-dependent caps your realistic chance of meaningful new regulars in the first year.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-top: 3px solid var(--amber-400); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow-sm);\">\n            <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 34px; color: var(--amber-500); line-height: 1;\">3.3×<\u002Fdiv>\n            <div style=\"margin-top: 10px; font-weight: 700; color: var(--text-primary);\">More likely to reorder<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 14px; color: var(--text-muted); line-height: var(--leading-normal);\">A diner on your app vs one who found you through an aggregator and never saw your name again.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: rgba(87,191,128,0.08); border: 1px solid rgba(87,191,128,0.3); border-top: 3px solid var(--teal-400); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow-sm);\">\n            <div style=\"font-family: var(--font-display); font-weight: 800; font-size: 34px; color: var(--teal-300); line-height: 1;\">2.4×<\u002Fdiv>\n            <div style=\"margin-top: 10px; font-weight: 700; color: var(--text-primary);\">Faster payback on every offer<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 14px; color: var(--text-muted); line-height: var(--leading-normal);\">A push notification to people who already love you beats an Instagram ad to strangers, every time.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ TIMELINE ============ -->\n  <section style=\"padding: var(--section-pad-y) var(--container-pad); background: var(--bg-deep); border-top: 1px solid var(--border-subtle);\">\n    <div style=\"max-width: 920px; margin: 0 auto;\">\n      <div data-reveal=\"\" style=\"text-align: center; max-width: 60ch; margin: 0 auto 56px;\">\n        <div style=\"font-family: var(--font-body); font-weight: 700; font-size: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--teal-300); margin-bottom: 14px;\">The rollout<\u002Fdiv>\n        <h2 style=\"font-family: var(--font-display); font-weight: 800; font-size: var(--text-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--text-primary); margin: 0;\">Here's exactly what happens after you say yes.<\u002Fh2>\n        <p style=\"margin: 18px auto 0; font-size: var(--text-lg); line-height: var(--leading-normal); color: var(--text-body);\">No mystery, no months of waiting. Most cafés are taking direct orders inside two weeks.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"position: relative; display: flex; flex-direction: column; gap: 16px;\">\n        <div style=\"position:absolute; left: 27px; top: 18px; bottom: 18px; width: 2px; background: var(--grad-divider);\"><\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; gap:18px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:56px; height:56px; border-radius:16px; background: var(--grad-amber); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--navy-900); box-shadow: var(--shadow-sm); z-index:1;\">1<\u002Fdiv>\n          <div style=\"flex:1; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--amber-400); border-radius: var(--radius-lg); padding: 18px 22px; box-shadow: var(--shadow-sm);\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between;\"><div style=\"font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-primary);\">Discovery call<\u002Fdiv><span style=\"font-size:11.5px; font-weight:700; color:var(--amber-500); text-transform:uppercase; letter-spacing:0.05em;\">Day 1<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:14px; color:var(--text-body); line-height:var(--leading-normal);\">We map your menu, branding, and current order volume so the app fits your café from day one.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; gap:18px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:56px; height:56px; border-radius:16px; background: var(--grad-teal); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--navy-900); box-shadow: var(--shadow-sm); z-index:1;\">2<\u002Fdiv>\n          <div style=\"flex:1; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--teal-400); border-radius: var(--radius-lg); padding: 18px 22px; box-shadow: var(--shadow-sm);\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between;\"><div style=\"font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-primary);\">Setup &amp; branding<\u002Fdiv><span style=\"font-size:11.5px; font-weight:700; color:var(--teal-300); text-transform:uppercase; letter-spacing:0.05em;\">Day 2–5<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:14px; color:var(--text-body); line-height:var(--leading-normal);\">Your logo, menu, and colours loaded into the platform. You review and approve before anything goes live.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; gap:18px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:56px; height:56px; border-radius:16px; background: var(--grad-amber); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--navy-900); box-shadow: var(--shadow-sm); z-index:1;\">3<\u002Fdiv>\n          <div style=\"flex:1; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--amber-400); border-radius: var(--radius-lg); padding: 18px 22px; box-shadow: var(--shadow-sm);\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between;\"><div style=\"font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-primary);\">QR code &amp; table rollout<\u002Fdiv><span style=\"font-size:11.5px; font-weight:700; color:var(--amber-500); text-transform:uppercase; letter-spacing:0.05em;\">Day 5–7<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:14px; color:var(--text-body); line-height:var(--leading-normal);\">Physical QR codes for tables, the counter, and receipts arrive ready to place.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; gap:18px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:56px; height:56px; border-radius:16px; background: var(--grad-teal); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--navy-900); box-shadow: var(--shadow-sm); z-index:1;\">4<\u002Fdiv>\n          <div style=\"flex:1; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--teal-400); border-radius: var(--radius-lg); padding: 18px 22px; box-shadow: var(--shadow-sm);\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between;\"><div style=\"font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-primary);\">Staff walkthrough<\u002Fdiv><span style=\"font-size:11.5px; font-weight:700; color:var(--teal-300); text-transform:uppercase; letter-spacing:0.05em;\">Day 7–8<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:14px; color:var(--text-body); line-height:var(--leading-normal);\">A 15-minute training on the order dashboard — that's all your team needs.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; gap:18px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:56px; height:56px; border-radius:16px; background: var(--grad-amber); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--navy-900); box-shadow: var(--shadow-sm); z-index:1;\">5<\u002Fdiv>\n          <div style=\"flex:1; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--amber-400); border-radius: var(--radius-lg); padding: 18px 22px; box-shadow: var(--shadow-sm);\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between;\"><div style=\"font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-primary);\">Soft launch<\u002Fdiv><span style=\"font-size:11.5px; font-weight:700; color:var(--amber-500); text-transform:uppercase; letter-spacing:0.05em;\">Day 8–10<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:14px; color:var(--text-body); line-height:var(--leading-normal);\">Test with your regulars first, iron out any wrinkles, gather the first reviews.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; gap:18px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:56px; height:56px; border-radius:16px; background: var(--grad-teal); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--navy-900); box-shadow: var(--shadow-sm); z-index:1;\">6<\u002Fdiv>\n          <div style=\"flex:1; background: rgba(87,191,128,0.1); border: 1px solid rgba(87,191,128,0.3); border-left: 3px solid var(--teal-400); border-radius: var(--radius-lg); padding: 18px 22px;\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between;\"><div style=\"font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-primary);\">Full launch<\u002Fdiv><span style=\"font-size:11.5px; font-weight:700; color:var(--teal-300); text-transform:uppercase; letter-spacing:0.05em;\">Day 10+<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:14px; color:var(--text-body); line-height:var(--leading-normal);\">Public rollout with in-store signage. Direct orders start landing — commission-free.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; gap:18px; align-items:flex-start;\">\n          <div style=\"flex:0 0 auto; width:56px; height:56px; border-radius:16px; border:2px dashed var(--border-strong); display:flex; align-items:center; justify-content:center; color:var(--text-muted); background:#fff; z-index:1;\"><span data-lucide=\"refresh-cw\"><\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-left: 3px solid var(--border-strong); border-radius: var(--radius-lg); padding: 18px 22px; box-shadow: var(--shadow-sm);\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; justify-content:space-between;\"><div style=\"font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text-primary);\">Ongoing<\u002Fdiv><span style=\"font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;\">Every month<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:14px; color:var(--text-body); line-height:var(--leading-normal);\">Monthly check-ins and a dashboard review to keep direct orders climbing.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ DEMO CTA ============ -->\n  <section id=\"demo\" style=\"padding: var(--section-pad-y) var(--container-pad); background: var(--bg-deep); border-top: 1px solid var(--border-subtle);\">\n    <div style=\"max-width: 980px; margin: 0 auto;\">\n      <div style=\"position: relative; overflow: hidden; background: var(--surface-card-solid); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);\">\n        <div aria-hidden=\"true\" style=\"position:absolute; inset:0; pointer-events:none; background: radial-gradient(520px 300px at 90% 0%, rgba(242,153,74,0.14), transparent 70%), radial-gradient(460px 280px at 0% 100%, rgba(87,191,128,0.14), transparent 70%);\"><\u002Fdiv>\n        <div style=\"position: relative; display: grid; grid-template-columns: 1.1fr 1fr; gap: 0;\">\n          <div style=\"padding: clamp(28px,4vw,48px);\">\n            <div style=\"font-family: var(--font-body); font-weight: 700; font-size: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--amber-500); margin-bottom: 14px;\">Stop renting. Start owning.<\u002Fdiv>\n            <h2 style=\"font-family: var(--font-display); font-weight: 800; font-size: var(--text-h1); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--text-primary); margin: 0;\">See your own app in 20 minutes.<\u002Fh2>\n            <p style=\"margin: 16px 0 0; color: var(--text-body); line-height: var(--leading-normal);\">Book a free demo and we'll show you a working mockup of <em>your<\u002Fem> café's ordering app — with your menu, your branding, and the exact rupees you'd reclaim in month one.<\u002Fp>\n            <ul style=\"list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 12px;\">\n              <li style=\"display:flex; gap:10px; align-items:center; color: var(--text-primary); font-size: 14.5px;\"><span data-lucide=\"check\" style=\"color: var(--teal-300);\"><\u002Fspan> Live in under 2 weeks<\u002Fli>\n              <li style=\"display:flex; gap:10px; align-items:center; color: var(--text-primary); font-size: 14.5px;\"><span data-lucide=\"check\" style=\"color: var(--teal-300);\"><\u002Fspan> No setup fee for the first 50 cafés<\u002Fli>\n              <li style=\"display:flex; gap:10px; align-items:center; color: var(--text-primary); font-size: 14.5px;\"><span data-lucide=\"check\" style=\"color: var(--teal-300);\"><\u002Fspan> Cancel anytime — your data stays yours<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div style=\"padding: clamp(28px,4vw,48px); border-left: 1px solid var(--border-subtle);\">\n            <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"height: 100%; min-height: 280px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 14px;\">\n                <div style=\"width:54px; height:54px; border-radius:16px; background: var(--grad-teal); display:flex; align-items:center; justify-content:center; box-shadow: var(--glow-teal);\"><span data-lucide=\"check\" style=\"color:#fff;\"><\u002Fspan><\u002Fdiv>\n                <h3 style=\"font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--text-primary); margin: 0;\">You're on the list, {{ submittedName }}.<\u002Fh3>\n                <p style=\"margin: 0; color: var(--text-body); line-height: var(--leading-normal);\">We'll call within one business day to set up your demo. Get ready to meet your café's app.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n              <form onsubmit=\"{{ submitForm }}\" style=\"display: flex; flex-direction: column; gap: 14px;\">\n                <div>\n                  <label style=\"display:block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;\">Your name<\u002Flabel>\n                  <input value=\"{{ fName }}\" onchange=\"{{ setFName }}\" placeholder=\"Arjun Mehta\" style=\"width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 15px; color: var(--text-primary); background: #fff; outline: none;\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;\">Café name<\u002Flabel>\n                  <input value=\"{{ fCafe }}\" onchange=\"{{ setFCafe }}\" placeholder=\"Brew &amp; Co.\" style=\"width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 15px; color: var(--text-primary); background: #fff; outline: none;\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;\">Phone / WhatsApp<\u002Flabel>\n                  <input value=\"{{ fPhone }}\" onchange=\"{{ setFPhone }}\" placeholder=\"+91 98765 43210\" style=\"width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 15px; color: var(--text-primary); background: #fff; outline: none;\">\n                <\u002Fdiv>\n                <div style=\"margin-top: 6px;\">\n                  <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.Button\" variant=\"primary\" size=\"lg\" glow=\"true\" type=\"submit\" hint-size=\"100%,52px\">Book my free demo<\u002Fx-import>\n                <\u002Fdiv>\n                <p style=\"margin: 2px 0 0; font-size: 12px; color: var(--text-muted); text-align: center;\">No spam. No commitment. Just the numbers for your café.<\u002Fp>\n              <\u002Fform>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"padding: 40px var(--container-pad); border-top: 1px solid var(--border-subtle); background: var(--bg-base);\">\n    <div style=\"max-width: var(--container-max); margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"width: 12px; height: 12px; border-radius: 999px; background: var(--grad-amber);\"><\u002Fspan>\n        <span style=\"font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.03em; color: var(--text-primary);\">Crave<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; color: var(--text-muted);\">Your customer. Your relationship. Forever.<\u002Fdiv>\n      <x-import component-from-global-scope=\"CraveDesignSystem_f1975e.Button\" variant=\"ghost\" size=\"sm\" onclick=\"{{ goDemo }}\" hint-size=\"auto,36px\">Book a demo<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { fName: '', fCafe: '', fPhone: '', submitted: false, submittedName: '' };\n\n  componentDidMount() {\n    this._initIcons();\n    this._initReveal();\n    this._initCharts();\n  }\n\n  componentDidUpdate() {\n    this._initIcons();\n  }\n\n  _initIcons() {\n    if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }\n  }\n\n  _initReveal() {\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach((el) => {\n      el.style.transition = 'opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1)';\n      if (!reduce) { el.style.opacity = '0'; el.style.transform = 'translateY(34px)'; }\n    });\n    if (reduce) { els.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }\n    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) { show(e.target); io.unobserve(e.target); }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    els.forEach((el) => io.observe(el));\n    // Fallback for environments where IO never fires (offscreen iframes):\n    // reveal anything still hidden after a moment, and on first scroll.\n    const sweep = () => els.forEach((el) => { if (el.style.opacity !== '1') { el.style.transition = 'none'; show(el); } });\n    setTimeout(sweep, 1400);\n    window.addEventListener('scroll', sweep, { once: true, passive: true });\n  }\n\n  _waitForChart(cb, tries) {\n    tries = tries || 0;\n    if (window.Chart) { cb(window.Chart); return; }\n    if (tries > 80) return;\n    setTimeout(() => this._waitForChart(cb, tries + 1), 60);\n  }\n\n  _initCharts() {\n    this._waitForChart((Chart) => {\n      const ink = '#18271f', muted = '#788278';\n      const C = { crimson: '#e0473f', teal: '#57bf80', tealDeep: '#3a9d5e', amber: '#f2994a', amberDeep: '#e07d28', amberLite: '#ffd9a8' };\n      Chart.defaults.font.family = \"'Inter', system-ui, sans-serif\";\n      Chart.defaults.color = muted;\n\n      const base = (extra) => Object.assign({\n        cutout: '58%',\n        plugins: {\n          legend: { position: 'bottom', labels: { color: ink, font: { size: 13, weight: '600' }, padding: 16, usePointStyle: true, pointStyleWidth: 12, boxHeight: 8 } },\n        },\n        animation: { duration: 1100, easing: 'easeOutCubic' },\n        responsive: true,\n        maintainAspectRatio: false,\n        borderColor: '#ffffff',\n        borderWidth: 3,\n      }, extra || {});\n\n      const ds = (data, colors) => ({ data, backgroundColor: colors, hoverOffset: 8, borderColor: '#fff', borderWidth: 3 });\n\n      const make = (key, cfg) => {\n        const el = document.querySelector('[data-chart=\"' + key + '\"]');\n        if (!el) return;\n        if (el._craveChart) return;\n        el._craveChart = new Chart(el.getContext('2d'), cfg);\n      };\n\n      make('orders', {\n        type: 'doughnut',\n        data: { labels: ['Swiggy / Zomato', 'Direct / Phone', 'Walk-in'], datasets: [ds([40, 35, 25], [C.crimson, C.teal, C.amber])] },\n        options: base({ plugins: { legend: { position: 'bottom', labels: { color: ink, font: { size: 13, weight: '600' }, padding: 16, usePointStyle: true, pointStyleWidth: 12, boxHeight: 8 } }, tooltip: { callbacks: { label: (c) => ' ' + c.label + ': ' + c.parsed + '%' } } } }),\n      });\n\n      make('money', {\n        type: 'doughnut',\n        data: { labels: ['Platform commission', 'Instagram & ads', 'Packaging & misc', 'Your profit'], datasets: [ds([30000, 8000, 20000, 62000], [C.crimson, C.amberDeep, C.amberLite, C.teal])] },\n        options: base({ plugins: { legend: { position: 'bottom', labels: { color: ink, font: { size: 12.5, weight: '600' }, padding: 14, usePointStyle: true, pointStyleWidth: 12, boxHeight: 8 } }, tooltip: { callbacks: { label: (c) => ' ' + c.label + ': ₹' + Number(c.parsed).toLocaleString('en-IN') } } } }),\n      });\n\n      make('retention', {\n        type: 'doughnut',\n        data: { labels: ['Regulars (with app)', 'Occasional', 'Lost customers'], datasets: [ds([40, 35, 25], [C.teal, C.amber, C.crimson])] },\n        options: base({ plugins: { legend: { position: 'bottom', labels: { color: ink, font: { size: 13, weight: '600' }, padding: 16, usePointStyle: true, pointStyleWidth: 12, boxHeight: 8 } }, tooltip: { callbacks: { label: (c) => ' ' + c.label + ': ' + c.parsed + '%' } } } }),\n      });\n\n      make('after', {\n        type: 'doughnut',\n        data: { labels: ['Direct orders (0% fee)', 'Platform orders (reduced)', 'New repeat customers'], datasets: [ds([55, 25, 20], [C.teal, C.amber, C.tealDeep])] },\n        options: base({ plugins: { legend: { position: 'bottom', labels: { color: ink, font: { size: 12.5, weight: '600' }, padding: 14, usePointStyle: true, pointStyleWidth: 12, boxHeight: 8 } }, tooltip: { callbacks: { label: (c) => ' ' + c.label + ': ' + c.parsed + '%' } } } }),\n      });\n    });\n  }\n\n  _scrollTo(id) {\n    const el = document.getElementById(id);\n    if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({ top: y, behavior: 'smooth' }); }\n  }\n\n  renderVals() {\n    return {\n      goDemo: () => this._scrollTo('demo'),\n      goProblem: () => this._scrollTo('problem'),\n      fName: this.state.fName,\n      fCafe: this.state.fCafe,\n      fPhone: this.state.fPhone,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      submittedName: this.state.submittedName || 'friend',\n      setFName: (e) => this.setState({ fName: e.target.value }),\n      setFCafe: (e) => this.setState({ fCafe: e.target.value }),\n      setFPhone: (e) => this.setState({ fPhone: e.target.value }),\n      submitForm: (e) => {\n        e.preventDefault();\n        const name = (this.state.fName || '').trim().split(' ')[0] || 'friend';\n        this.setState({ submitted: true, submittedName: name });\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
